<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}

         {% if user_login_form.non_field_errors %}
            {% for error in user_create_form.non_field_errors %}
                {{ error }}
            {% endfor %}
        {% endif %}

        <table>

            {% for field in user_login_form %}
                <tr>
                    <td>
                        {{ field.label }}
                    </td>
                    <td>
                        : {{ field }}
                    </td>
                </tr>
            {% endfor %}
            <tr>
                <td>
                    <button type="submit">LOGIN</button>
                </td>
                <td>
                    <button type="reset">RESET</button>
                </td>
            </tr>
        </table>
    </form>
    Not have an account? <a href="{% url 'accounts:regsiter_user' %}">Register</a>
</body>
</html>
