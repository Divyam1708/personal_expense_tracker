{% extends 'base/Base_1.html' %}
{% load static %}

{% block title %}
    EXPENSES
{% endblock title %}

{% block new_css_files %}    
<link rel="stylesheet" href="{% static 'expenses/styles/home_1.css' %}">
{% endblock new_css_files %}    

{% block body %}
    <section class="container_full">
        <form action="" method="post">
            {% csrf_token %}
            <table>
                {% for field in form %}
                <tr>
                    <td>
                        {{ field.label }} 
                    </td>
                    <td>
                        : {{ field }}
                    </td>
                </tr>
                {% endfor %}
                <tr>
                    <td>
                        <button>Push edit</button>
                    </td>
                </tr>
            </table>
        </form>
    </section>

{% endblock body %}
